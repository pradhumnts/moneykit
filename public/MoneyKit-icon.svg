    <!-- Lime middle compartment -->
    <path fill="#C1F07F" stroke="#FFFFFF" stroke-width="20" stroke-linejoin="round" d="M405 349h445c34 0 61 27 61 61v54c-17-9-36-14-56-14H400c-20 0-39 5-56 14v-54c0-34 27-61 61-61Z"/>

    <!-- Front pocket -->
    <path fill="#062D1A" stroke="#FFFFFF" stroke-width="22" stroke-linejoin="round" d="M395 463h466c40 0 73 33 73 73 0 32-26 52-58 52H380c-32 0-58-20-58-52 0-40 33-73 73-73Z"/>

    <!-- Integrated latch / negative-space transition -->
