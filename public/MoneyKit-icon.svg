<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">MoneyKit app icon</title>
  <desc id="desc">A rounded forest-green money kit with three organized compartments, a lime accent pocket, and an integrated rupee symbol.</desc>

  <rect width="1024" height="1024" fill="#FFFFFF"/>

  <g transform="translate(512 512) scale(0.64) translate(-618.5 -609.5)">
    <!-- Main kit body and side walls -->
    <path fill="#062D1A" d="M348 381c-25 0-45 20-45 45v451c0 56 45 101 101 101h448c56 0 101-45 101-101V426c0-25-20-45-45-45H348Z"/>

    <!-- Upper compartment -->
